<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List Web App</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <p>shantanu24sharma@gmail.com</p>
            </div>
            <div class="menu">
                <h2>My projects:</h2>
                <ol class="project-list">
                    
                </ol>
                <div class="add-project">

                </div>
            </div>
            <div class="footer">
                <img src="./svg/help.svg" alt="Help & resources" width="18" height="18">
                <p>Help & resources</p>
            </div>
        </div>

        <div class="content">
            <div class="header">
                <p>My projects/</p>
            </div>
            <div class="todo-list">
                
            </div>
          
        </div>
    </div>

    <dialog id="todo-dialog">
        <form method="post">
            <label for="todo">Name:</label>
            <input type="text" name="todo" id="todo" placeholder="Enter To-Do" required>

            <label for="description">Description:</label>
            <input type="text" name="description" id="description" placeholder="Enter Description" required>

            <label for="dueDate">Due Date:</label>
            <input type="date" name="dueDate" id="dueDate" required>

            <label for="priority">Priority:</label>
            <select name="priority" id="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <button type="submit">Add</button>
            <button type="button" id="cancel-btn">Cancel</button>
        </form>
    </dialog>

    <dialog id="project-dialog">
        <form method="post">
            <label for="project">Name:</label>
            <input type="text" name="project" id="project" placeholder="Enter Project" required>
            <button type="submit">Add</button>
            <button type="button" id="cancel-btn">Cancel</button>
        </form>
    </dialog>
</body>
</html>
